name: Structure
on: [push]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/check/requirements.txt
      - name: 최신 커밋 검사
        env:
          AFTER: ${{ github.sha }}
        run: python3 tools/check/run.py --range "$AFTER~1..$AFTER"
