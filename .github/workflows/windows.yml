name: Windows
on:
  push:
    branches: ['**']
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: win64_msvc2022_64
          cache: true
      - name: 구성
        shell: bash
        run: QT_ROOT="$QT_ROOT_DIR" cmake --preset windows-release
      - run: cmake --build --preset windows-release
      - run: ctest --preset windows-release
      - run: cmake --build build/windows-release --target package
      - uses: actions/upload-artifact@v4
        with:
          name: K-GroundControl-windows
          path: build/windows-release/*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/windows-release/*.zip
