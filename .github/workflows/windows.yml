name: Windows
on:
  push:
    branches: ['**']
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: win64_msvc2022_64
          # 0.0.2 차트(Qt Graphs)는 추가 모듈이고, Graphs 라이브러리가 Quick3D·ShaderTools에 기대요.
          modules: 'qtgraphs qtquick3d qtshadertools qtserialport'
          cache: true
          # aqtinstall 3.3.0은 Qt 6.11+ Windows 저장소 구조를 못 읽어요. 지원이 들어간 master 커밋으로 고정해요.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
      - name: 구성
        shell: bash
        run: QT_ROOT="$QT_ROOT_DIR" cmake --preset windows-release
      - run: cmake --build --preset windows-release
      - run: ctest --preset windows-release
      - run: cmake --build build/windows-release --target package
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          retention-days: 2
          path: build/windows-release/*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/windows-release/*.zip
