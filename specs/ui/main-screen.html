<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-GroundControl 메인 화면 와이어프레임</title>
<style>
  :root { --bg: #f3f4f6; --box: #e5e7eb; --line: #9ca3af; --ink: #111827; --dim: #6b7280; --accent: #374151;
          --map: repeating-linear-gradient(45deg,#e5e7eb 0 12px,#eceef1 12px 24px); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  header.doc { padding: 16px 24px 12px; }
  header.doc h1 { margin: 0 0 4px; font-size: 18px; }
  header.doc p { margin: 2px 0; color: var(--dim); font-size: 13px; }

  .frame { margin: 0 24px 24px; border: 2px solid var(--accent); background: #fff; width: 1392px; max-width: calc(100vw - 48px); height: 820px;
    display: grid; grid-template-rows: 48px 1fr 32px; grid-template-columns: 200px 1fr 280px;
    grid-template-areas: "top top top" "left center right" "bottom bottom bottom"; }
  .region { border: 1px dashed var(--line); background: var(--box); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--dim); }
  .top { grid-area: top; }
  .left { grid-area: left; }
  .right { grid-area: right; }
  .bottom { grid-area: bottom; }
  .center { grid-area: center; position: relative; background: var(--map); border: 1px dashed var(--line); }
  .center-label { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 14px; color: var(--dim); text-align: center; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#111827; --box:#1f2937; --line:#4b5563; --ink:#e5e7eb; --dim:#9ca3af; --accent:#d1d5db;
      --map: repeating-linear-gradient(45deg,#1f2937 0 12px,#243042 12px 24px); }
    :root:not([data-theme="light"]) .frame { background:#0b1220; }
  }
</style>
</head>
<body>
<header class="doc">
  <h1>K-GroundControl 메인 화면 — 와이어프레임</h1>
  <p>2026-10-24 · PM · 상태: <b>초안(승인 전)</b> · 사용자 지시대로 한 칸씩 채움</p>
  <p>틀: 상단바 48px / 좌 사이드바 200px / 가운데 지도 / 우 사이드바 280px / 하단바 32px</p>
</header>

<div class="frame">
  <div class="region top">상단바</div>
  <div class="region left">좌 사이드바</div>
  <div class="center"><div class="center-label">지도</div></div>
  <div class="region right">우 사이드바</div>
  <div class="region bottom">하단바</div>
</div>
</body>
</html>
